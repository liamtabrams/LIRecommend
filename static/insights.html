<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insights</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            height: auto;
            overflow: auto;
            text-align: center;
            box-sizing: border-box;
            padding-top: 20px;
        }
        h1 {
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
        }
        table {
            width: 80%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        button {
            margin: 20px;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Insights</h1>
    <div class="img-container">
        <img id="feature-importance-image" alt="Feature Importances">
    </div>
    <button id="load-insights-btn" onclick="fetchInsights()">Load Insights</button>
    <div id="top-phrases" class="phrases-container">
        <h2>Top 10 Phrases and Scores</h2>
        <table id="top-10-table">
            <thead>
                <tr>
                    <th>Phrase</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be populated dynamically -->
            </tbody>
        </table>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOMContentLoaded event triggered');

            // Fetch feature importances
            fetch('/feature-importances')
                .then(response => {
                    console.log('Fetch /feature-importances initiated');
                    if (!response.ok) {
                        throw new Error('Network response was not ok for /feature-importances');
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Data fetched from /feature-importances:', data);
                    const imgElement = document.getElementById('feature-importance-image');
                    imgElement.src = 'feature_importances.png';
                })
                .catch(error => {
                    console.error('Error fetching the feature importances image:', error);
                });
        });

       // Function to fetch insights and populate the table
       function fetchInsights() {
            fetch('/insights', {
                method: 'POST'
            })
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.querySelector('#top-10-table tbody');
                    tableBody.innerHTML = ''; // Clear existing rows

                    // Iterate through the returned dictionary
                    for (const [phrase, score] of Object.entries(data)) {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${phrase}</td>
                            <td>${score}</td>
                        `;
                        tableBody.appendChild(row);
                    }
                })
                .catch(error => {
                    console.error('Error fetching insights data:', error);
                });
        }
    </script>
</body>
</html>
